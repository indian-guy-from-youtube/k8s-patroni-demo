apiVersion: v1
kind: Service
metadata:
  name: notes-metrics
  namespace: default
  labels:
    app: notes-metrics
spec:
  selector:
    app: notes
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notes
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      app: notes-metrics
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: demo
      rules:
        - alert: NotesReplicasLow
          expr: kube_deployment_status_replicas_available{deployment="notes"} < 3
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Доступно меньше 3 копий приложения"
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Нода Kubernetes недоступна: {{ $labels.node }}"
        - alert: PatroniNoLeader
          expr: (sum(patroni_primary) or vector(0)) == 0
          for: 20s
          labels:
            severity: critical
          annotations:
            summary: "У PostgreSQL нет лидера"
        - alert: PatroniLeaderChanged
          expr: changes(patroni_postgres_timeline[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Сменился лидер PostgreSQL"
        - alert: PatroniNodeDown
          expr: up{job="patroni"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "Нода БД недоступна: {{ $labels.node }}"
        - alert: NotesHigh5xx
          expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) > 0.1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Приложение отдаёт ошибки 5xx"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  demo.json: |
    {
      "title": "Состояние сервиса",
      "uid": "demo-overview",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Копии приложения (доступно)",
         "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "kube_deployment_status_replicas_available{deployment=\"notes\"}"}]},
        {"id": 2, "type": "stat", "title": "Лидеры PostgreSQL (должен быть 1)",
         "gridPos": {"x": 6, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(patroni_primary)"}]},
        {"id": 3, "type": "stat", "title": "Ноды Kubernetes Ready",
         "gridPos": {"x": 12, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}]},
        {"id": 4, "type": "stat", "title": "Ноды БД на связи",
         "gridPos": {"x": 18, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(up{job=\"patroni\"})"}]},
        {"id": 5, "type": "timeseries", "title": "Запросы в секунду по кодам ответа",
         "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (status)", "legendFormat": "{{status}}"}]},
        {"id": 6, "type": "timeseries", "title": "Память JVM по копиям",
         "gridPos": {"x": 12, "y": 5, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(jvm_memory_used_bytes{area=\"heap\"}) by (pod)", "legendFormat": "{{pod}}"}]}
      ]
    }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
spec:
  ingressClassName: nginx
  tls:
    - secretName: demo-tls
      hosts:
        - prometheus.local
        - alertmanager.local
  rules:
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  ingressClassName: nginx
  tls:
    - secretName: demo-tls
      hosts:
        - prometheus.local
        - alertmanager.local
  rules:
    - host: alertmanager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-alertmanager
                port:
                  number: 9093
